name: Publish and bump

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment to commit AFTER publishing the current version
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      operation:
        description: Publish normally, or finish a bump after the current version was already published
        type: choice
        options: [publish-and-bump, finish-bump]
        default: publish-and-bump
        required: true

concurrency:
  group: jsr-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish and prepare next version
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: browser-actions/setup-firefox@v1
        id: firefox
      - name: Test library
        run: deno task test
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
      - name: Check API documentation
        run: deno task docs:check
      - name: Check package
        run: deno task publish:check
      - name: Create release App token
        uses: actions/create-github-app-token@v3
        id: release-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish current version, then commit next version
        env:
          RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          VERSION_INCREMENT: ${{ inputs.increment }}
        run: deno run --allow-read --allow-write --allow-env --allow-net=api.github.com,jsr.io --allow-run scripts/publish_and_bump.ts "$RELEASE_OPERATION" "$VERSION_INCREMENT"
